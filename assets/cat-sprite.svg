<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="cat-svg">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="45" ry="35" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="40" fill="#F4A460"/>

  <!-- Ears -->
  <polygon points="70,60 60,30 85,55" fill="#F4A460"/>
  <polygon points="130,60 140,30 115,55" fill="#F4A460"/>
  <!-- Inner ears -->
  <polygon points="72,57 65,37 83,54" fill="#FFB6C1"/>
  <polygon points="128,57 135,37 117,54" fill="#FFB6C1"/>

  <!-- Stripes on forehead -->
  <path d="M 88 65 Q 100 60 112 65" fill="none" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 90 70 Q 100 66 110 70" fill="none" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <g class="cat-eye cat-eye--left" transform-origin="85 85">
    <ellipse cx="85" cy="85" rx="7" ry="8" fill="#333"/>
    <ellipse cx="83" cy="83" rx="2.5" ry="3" fill="#FFF" opacity="0.8"/>
  </g>
  <g class="cat-eye cat-eye--right" transform-origin="115 85">
    <ellipse cx="115" cy="85" rx="7" ry="8" fill="#333"/>
    <ellipse cx="113" cy="83" rx="2.5" ry="3" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- Blush -->
  <circle class="cat-blush" cx="72" cy="95" r="6" fill="#FFB6C1"/>
  <circle class="cat-blush" cx="128" cy="95" r="6" fill="#FFB6C1"/>

  <!-- Nose -->
  <polygon points="100,95 96,100 104,100" fill="#FF6B6B"/>

  <!-- Mouth (neutral) -->
  <g class="cat-mouth cat-mouth-neutral">
    <path d="M 96 103 Q 100 107 104 103" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Mouth (smile - hidden by default) -->
  <g class="cat-mouth-smile" opacity="0">
    <path d="M 93 103 Q 100 112 107 103" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Whiskers -->
  <line x1="60" y1="93" x2="78" y2="96" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  <line x1="58" y1="100" x2="77" y2="100" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  <line x1="122" y1="96" x2="140" y2="93" stroke="#333" stroke-width="1" stroke-linecap="round"/>
  <line x1="123" y1="100" x2="142" y2="100" stroke="#333" stroke-width="1" stroke-linecap="round"/>

  <!-- Front paws -->
  <ellipse cx="82" cy="165" rx="12" ry="8" fill="#F4A460"/>
  <ellipse cx="118" cy="165" rx="12" ry="8" fill="#F4A460"/>
  <!-- Paw pads -->
  <circle cx="79" cy="167" r="2.5" fill="#FFB6C1"/>
  <circle cx="85" cy="167" r="2.5" fill="#FFB6C1"/>
  <circle cx="115" cy="167" r="2.5" fill="#FFB6C1"/>
  <circle cx="121" cy="167" r="2.5" fill="#FFB6C1"/>

  <!-- Tail -->
  <path class="cat-tail" d="M 140 145 Q 165 140 170 120 Q 175 100 165 95"
        fill="none" stroke="#F4A460" stroke-width="10" stroke-linecap="round"
        transform-origin="140 145"/>

  <!-- Tail stripes -->
  <path d="M 158 128 Q 163 125 165 120" fill="none" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 163 115 Q 167 110 167 105" fill="none" stroke="#D2691E" stroke-width="2" stroke-linecap="round"/>
</svg>
